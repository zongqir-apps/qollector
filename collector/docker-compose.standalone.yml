services:
  collector:
    image: ${QOLLECT_IMAGE:-ghcr.io/zongqir/qollect-collector:latest}
    build:
      context: .
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      QOLLECT_TOKEN: ${QOLLECT_TOKEN:?Set QOLLECT_TOKEN in .env}
      QOLLECT_RETENTION_DAYS: ${QOLLECT_RETENTION_DAYS:-30}
      QOLLECT_MAX_TEXT_CHARS: ${QOLLECT_MAX_TEXT_CHARS:-2000}
      QOLLECT_PREVIEW_CHARS: ${QOLLECT_PREVIEW_CHARS:-200}
      QOLLECT_TIMEZONE: ${QOLLECT_TIMEZONE:-UTC}
      QOLLECT_AI_API_KEY: ${QOLLECT_AI_API_KEY:-}
      QOLLECT_AI_BASE_URL: ${QOLLECT_AI_BASE_URL:-https://api.siliconflow.cn/v1}
      QOLLECT_AI_MODEL: ${QOLLECT_AI_MODEL:-Qwen/Qwen3-VL-32B-Instruct}
    volumes:
      - ./data:/data
    networks:
      - collector
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      collector:
        condition: service_healthy
    environment:
      QOLLECT_DOMAIN: ${QOLLECT_DOMAIN:?Set QOLLECT_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    networks:
      - collector

networks:
  collector:
